# Screenshots for the README (docs/screenshots/) and the F-Droid listing. Taken only on an
# emulator, with only the fictional media of `scripts/test-media.ps1 -Mode screenshots` and the
# PC tab paired with mock-jam's screenshots fixture at 10.0.2.2:4120, so no real library,
# artwork, listening history or address can show. Every other music folder is switched off
# first. Not part of the test suite. Maestro writes the PNGs under its run folder
# (~/.maestro/tests/<run>/store-screenshots/takeScreenshot/docs/screenshots/); check every one
# by eye, then copy them to docs/screenshots/ and
# fastlane/metadata/android/en-US/images/phoneScreenshots/.
#   .\scripts\test-media.ps1 -Mode screenshots -Serial <emulator-serial>
#   node scripts/mock-jam.ts --port 4120 --fixture screenshots
#   adb -s <emulator-serial> shell cmd uimode night yes
#   adb -s <emulator-serial> shell settings put global sysui_demo_allowed 1
#   adb -s <emulator-serial> shell am broadcast -a com.android.systemui.demo -e command enter
#   adb -s <emulator-serial> shell am broadcast -a com.android.systemui.demo -e command clock -e hhmm 1200
#   adb -s <emulator-serial> shell am broadcast -a com.android.systemui.demo -e command notifications -e visible false
#   maestro --device <emulator-serial> test scripts/store-screenshots.yaml
#   adb -s <emulator-serial> shell am broadcast -a com.android.systemui.demo -e command exit
#   adb -s <emulator-serial> shell cmd uimode night no
#   .\scripts\test-media.ps1 -Mode clean -Serial <emulator-serial>
appId: com.anywecon.aulos
env:
  JAM_HOST: 10.0.2.2:4120
  MOCK_JAM_ADMIN: http://127.0.0.1:4120
  OTHER_FOLDERS: '^(?!Music/AulosTest/).*'
---
- runFlow: ../.maestro/common/fresh-start.yaml
- runScript: ../.maestro/common/reset-mock-jam.js
- tapOn: 'Settings'
- tapOn:
    id: 'settings-folders'
- repeat:
    while:
      visible:
        id: 'folder-switch-.*'
        text: '${OTHER_FOLDERS}'
        checked: true
    commands:
      - tapOn:
          id: 'folder-switch-.*'
          text: '${OTHER_FOLDERS}'
          checked: true
- back
- extendedWaitUntil:
    visible:
      id: 'settings-folders'
    timeout: 30000
- tapOn: 'Library'
- runFlow:
    file: ../.maestro/common/open-section.yaml
    env:
      SECTION: albums
- takeScreenshot: docs/screenshots/2-albums
- scrollUntilVisible:
    element: 'Night Ferry'
- tapOn: 'Night Ferry'
- assertVisible:
    id: 'detail-title'
- takeScreenshot: docs/screenshots/3-album
- tapOn:
    id: 'album-play'
- extendedWaitUntil:
    visible:
      id: 'mini-player'
    timeout: 10000
- tapOn:
    id: 'mini-player'
- assertVisible:
    id: 'now-playing'
- tapOn:
    id: 'np-play-pause'
- takeScreenshot: docs/screenshots/4-now-playing
- back
- back
- runFlow:
    file: ../.maestro/common/open-section.yaml
    env:
      SECTION: songs
- takeScreenshot: docs/screenshots/1-library
- tapOn: 'Search'
- tapOn:
    id: 'search-input'
- inputText: 'lantern'
- extendedWaitUntil:
    visible:
      id: 'search-song-0'
    timeout: 10000
- hideKeyboard
- takeScreenshot: docs/screenshots/5-search
- runFlow: ../.maestro/common/pc-pair.yaml
- extendedWaitUntil:
    visible:
      id: 'pc-play-pause'
    timeout: 15000
- takeScreenshot: docs/screenshots/6-pc-remote
- tapOn: 'Settings'
- takeScreenshot: docs/screenshots/7-settings
